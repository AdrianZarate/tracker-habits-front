worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;

    # Keep all writable runtime paths available to the nonroot worker.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        error_page 404 = @not_found;

        location @not_found {
            types { }
            default_type text/plain;
            return 404 "Not found\n";
        }

        # Missing bundles (even extensionless ones) must not return the SPA.
        location ^~ /assets/ {
            try_files $uri =404;
        }

        # A route parameter may contain dots; it is not an asset filename.
        location ~ ^/habits/[^/]+/?$ {
            try_files $uri /index.html;
        }

        # Public assets and other file requests also fail honestly.
        location ~* \.[^/]+$ {
            try_files $uri =404;
        }

        # BrowserRouter: /login, /dashboard and /habits/:id load the SPA.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
